<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoCast - Creator Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; }
    body { background: linear-gradient(135deg, #1f0b2e, #5a1e55); color: #fff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 4rem; background: rgba(0,0,0,0.2); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
    .logo { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
    .auth-btns { display: flex; align-items: center; gap: 1rem; }
    .auth-btns button { padding: 0.5rem 1.2rem; border-radius: 20px; border: none; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: 0.3s; }
    .auth-btns .logout { background: transparent; border: 1px solid #ff4757; color: #ff4757; }
    .auth-btns .logout:hover { background: #ff4757; color: #fff; }

    .studio-container { flex: 1; display: flex; max-width: 1400px; margin: 0 auto; width: 100%; padding: 2rem; gap: 2rem; }
    
    .sidebar { width: 280px; background: rgba(0,0,0,0.3); border-radius: 20px; padding: 2rem; border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 1rem; }
    .sidebar h2 { font-family: "Raleway", sans-serif; font-size: 1.5rem; margin-bottom: 1.5rem; opacity: 0.9; }
    .nav-btn { background: transparent; border: none; color: #fff; text-align: left; padding: 1rem 1.2rem; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; opacity: 0.7; }
    .nav-btn:hover { background: rgba(255,255,255,0.05); opacity: 1; }
    .nav-btn.active { background: rgba(192,101,187,0.3); color: #fff; opacity: 1; border: 1px solid rgba(192,101,187,0.5); }
    
    .content-area { flex: 1; background: rgba(0,0,0,0.2); border-radius: 20px; padding: 3rem; border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); min-height: 600px; }
    .section { display: none; animation: fadeIn 0.3s ease; }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .section h3 { font-size: 2rem; font-family: "Raleway", sans-serif; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; }
    
    /* Forms */
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; opacity: 0.8; }
    .form-control { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; padding: 1rem; font-size: 1rem; font-family: inherit; transition: 0.2s; outline: none; }
    .form-control:focus { border-color: #c065bb; background: rgba(0,0,0,0.5); }
    textarea.form-control { resize: vertical; min-height: 120px; }
    input[type="file"] { padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px dashed rgba(255,255,255,0.2); cursor: pointer; }
    
    .btn-submit { background: linear-gradient(135deg, #c065bb, #792b73); color: #fff; border: none; padding: 1rem 2rem; border-radius: 30px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 1rem; display: flex; justify-content: center; align-items: center; gap: 10px; }
    .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(192,101,187,0.4); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Episode List */
    .ep-list { display: flex; flex-direction: column; gap: 1rem; }
    .ep-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 1rem 1.5rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
    .ep-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); }
    .ep-info h4 { font-size: 1.1rem; margin-bottom: 0.2rem; }
    .ep-info p { font-size: 0.85rem; opacity: 0.6; }
    .btn-delete { background: rgba(255,71,87,0.2); color: #ff4757; border: 1px solid rgba(255,71,87,0.4); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; font-weight: 600; }
    .btn-delete:hover { background: #ff4757; color: #fff; }
    
    /* Journey Checkboxes */
    .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; max-height: 300px; overflow-y: auto; padding-right: 1rem; }
    .checkbox-label { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
    .checkbox-label:hover { background: rgba(255,255,255,0.1); }
    .checkbox-label input { width: 18px; height: 18px; accent-color: #c065bb; cursor: pointer; }
    
    /* Notifications */
    .toast { position: fixed; bottom: 30px; right: 30px; background: rgba(0,0,0,0.8); border: 1px solid #c065bb; color: #fff; padding: 1rem 2rem; border-radius: 12px; font-weight: 600; backdrop-filter: blur(10px); transform: translateY(100px); opacity: 0; transition: 0.3s; z-index: 1000; display: flex; align-items: center; gap: 10px; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { border-color: #ff4757; }
    .toast.success { border-color: #2ed573; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="location.href='home.html'"><i class="fas fa-hammer"></i> EchoCast Studio</div>
    <div class="auth-btns" id="authBtns">
      <span>Welcome! <span id="adminName">Admin</span></span>
      <button class="logout" onclick="logout()">Exit Studio</button>
    </div>
  </header>

  <div class="studio-container">
    <div class="sidebar">
      <h2>Studio Menu</h2>
      <button class="nav-btn active" data-target="uploadSec"><i class="fas fa-cloud-upload-alt"></i> Upload Episode</button>
      <button class="nav-btn" data-target="manageSec"><i class="fas fa-list"></i> Manage Episodes</button>
      <button class="nav-btn" data-target="journeySec"><i class="fas fa-route"></i> Create Journey</button>
      <button class="nav-btn" data-target="settingsSec"><i class="fas fa-cog"></i> Settings</button>
    </div>

    <div class="content-area">
      <!-- Upload Section -->
      <div class="section active" id="uploadSec">
        <h3>Upload New Episode</h3>
        <form id="uploadForm">
          <div class="form-group">
            <label>Episode Title</label>
            <input type="text" class="form-control" id="upTitle" required placeholder="e.g., The Future of AI">
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="text" class="form-control" id="upCategory" required placeholder="e.g., Technology">
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea class="form-control" id="upDesc" required placeholder="What is this episode about?"></textarea>
          </div>
          <div class="form-group">
            <label>Audio File (.mp3, .wav)</label>
            <input type="file" class="form-control" id="upFile" accept="audio/*" required>
          </div>
          <button type="submit" class="btn-submit" id="upSubmitBtn"><i class="fas fa-upload"></i> Upload & Publish</button>
        </form>
      </div>

      <!-- Manage Section -->
      <div class="section" id="manageSec">
        <h3>Manage Episodes</h3>
        <div class="ep-list" id="manageList">
          <div style="text-align:center; opacity:0.5;"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
        </div>
      </div>

      <!-- Journey Section -->
      <div class="section" id="journeySec">
        <h3>Create Curated Journey</h3>
        <form id="journeyForm">
          <div class="form-group">
            <label>Journey Title</label>
            <input type="text" class="form-control" id="jTitle" required placeholder="e.g., Startup Masterclass">
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="text" class="form-control" id="jCategory" required placeholder="e.g., Business">
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea class="form-control" id="jDesc" required placeholder="Describe what the listener will learn..."></textarea>
          </div>
          <div class="form-group">
            <label>Select Episodes for this Journey</label>
            <div class="checkbox-grid" id="jEpGrid">
              <div style="opacity:0.5;">Loading episodes...</div>
            </div>
          </div>
          <button type="submit" class="btn-submit" id="jSubmitBtn"><i class="fas fa-plus"></i> Create Journey</button>
        </form>
      </div>

      <!-- Settings Section -->
      <div class="section" id="settingsSec">
        <h3>Change Admin Password</h3>
        <form id="passwordForm">
          <div class="form-group">
            <label>Current Password</label>
            <input type="password" class="form-control" id="curPass" required>
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" class="form-control" id="newPass" required>
          </div>
          <button type="submit" class="btn-submit" id="passSubmitBtn"><i class="fas fa-lock"></i> Update Password</button>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><i class="fas fa-info-circle"></i> <span id="toastMsg">Message</span></div>

  <script>
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");
    const username = localStorage.getItem("username");

    // Security Check
    if (!token || role !== "admin") {
      alert("Unauthorized access. Redirecting to home.");
      window.location.href = "home.html";
    }

    document.getElementById("adminName").innerText = username || "Admin";

    const logout = () => {
      localStorage.removeItem("token");
      localStorage.removeItem("role");
      localStorage.removeItem("username");
      window.location.href = "home.html";
    };

    const showToast = (msg, type = "success") => {
      const t = document.getElementById("toast");
      document.getElementById("toastMsg").innerText = msg;
      t.className = `toast show ${type}`;
      setTimeout(() => t.className = "toast", 3000);
    };

    // Navigation Logic
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.target).classList.add("active");
        
        if (btn.dataset.target === "manageSec") loadManageEpisodes();
        if (btn.dataset.target === "journeySec") loadJourneyEpisodes();
      });
    });

    // Upload Logic
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("upSubmitBtn");
      const fileInput = document.getElementById("upFile");
      if (!fileInput.files[0]) return showToast("Please select a file.", "error");

      const formData = new FormData();
      formData.append("title", document.getElementById("upTitle").value);
      formData.append("category", document.getElementById("upCategory").value);
      formData.append("description", document.getElementById("upDesc").value);
      formData.append("audioFile", fileInput.files[0]);

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';

      try {
        const res = await fetch("http://localhost:3000/api/upload", {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` },
          body: formData
        });
        const data = await res.json();
        if (res.ok) {
          showToast("Episode uploaded successfully!");
          document.getElementById("uploadForm").reset();
        } else {
          showToast(data.message || "Upload failed", "error");
        }
      } catch (err) {
        showToast("Network error during upload.", "error");
      }
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-upload"></i> Upload & Publish';
    });

    // Manage Episodes Logic
    const loadManageEpisodes = async () => {
      const list = document.getElementById("manageList");
      list.innerHTML = '<div style="text-align:center; opacity:0.5;"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
      try {
        const res = await fetch("http://localhost:3000/api/episodes");
        const eps = await res.json();
        if (eps.length === 0) {
          list.innerHTML = '<div style="opacity:0.5; text-align:center;">No episodes found.</div>';
          return;
        }
        list.innerHTML = "";
        eps.forEach(ep => {
          const div = document.createElement("div");
          div.className = "ep-item";
          div.innerHTML = `
            <div class="ep-info">
              <h4>${ep.title}</h4>
              <p>${ep.category} · ${ep.duration || 'Unknown'}</p>
            </div>
            <button class="btn-delete" onclick="deleteEpisode('${ep._id}', this)"><i class="fas fa-trash"></i> Delete</button>
          `;
          list.appendChild(div);
        });
      } catch (err) {
        list.innerHTML = '<div style="color:#ff4757;">Failed to load episodes.</div>';
      }
    };

    window.deleteEpisode = async (id, btnEl) => {
      if (!confirm("Are you sure you want to delete this episode? This action cannot be undone.")) return;
      btnEl.disabled = true;
      btnEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      try {
        const res = await fetch(`http://localhost:3000/api/episodes/${id}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.ok) {
          showToast("Episode deleted.");
          btnEl.parentElement.remove();
        } else {
          showToast("Failed to delete.", "error");
          btnEl.disabled = false;
          btnEl.innerHTML = '<i class="fas fa-trash"></i> Delete';
        }
      } catch (err) {
        showToast("Network error.", "error");
        btnEl.disabled = false;
        btnEl.innerHTML = '<i class="fas fa-trash"></i> Delete';
      }
    };

    // Journey Logic
    const loadJourneyEpisodes = async () => {
      const grid = document.getElementById("jEpGrid");
      grid.innerHTML = '<div style="opacity:0.5;">Loading episodes...</div>';
      try {
        const res = await fetch("http://localhost:3000/api/episodes");
        const eps = await res.json();
        if (eps.length === 0) {
          grid.innerHTML = '<div style="opacity:0.5;">No episodes available.</div>';
          return;
        }
        grid.innerHTML = "";
        eps.forEach(ep => {
          grid.innerHTML += `
            <label class="checkbox-label">
              <input type="checkbox" name="journeyEps" value="${ep._id}">
              <span style="font-size:0.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${ep.title}</span>
            </label>
          `;
        });
      } catch (err) {
        grid.innerHTML = '<div style="color:#ff4757;">Failed to load episodes.</div>';
      }
    };

    document.getElementById("journeyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("jSubmitBtn");
      
      const selectedEps = Array.from(document.querySelectorAll('input[name="journeyEps"]:checked')).map(cb => cb.value);
      if (selectedEps.length === 0) return showToast("Please select at least one episode.", "error");

      const payload = {
        title: document.getElementById("jTitle").value,
        category: document.getElementById("jCategory").value,
        description: document.getElementById("jDesc").value,
        episodes: selectedEps
      };

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

      try {
        const res = await fetch("http://localhost:3000/api/journeys", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}` 
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          showToast("Journey created successfully!");
          document.getElementById("journeyForm").reset();
        } else {
          showToast(data.message || "Failed to create", "error");
        }
      } catch (err) {
        showToast("Network error.", "error");
      }
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-plus"></i> Create Journey';
    });

    // Change Password Logic
    document.getElementById("passwordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("passSubmitBtn");
      const currentPassword = document.getElementById("curPass").value;
      const newPassword = document.getElementById("newPass").value;

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

      try {
        const res = await fetch("http://localhost:3000/api/admin/change-password", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}` 
          },
          body: JSON.stringify({ currentPassword, newPassword })
        });
        const data = await res.json();
        if (res.ok) {
          showToast("Password updated successfully!");
          document.getElementById("passwordForm").reset();
        } else {
          showToast(data.message || "Failed to update password", "error");
        }
      } catch (err) {
        showToast("Network error.", "error");
      }
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-lock"></i> Update Password';
    });

  </script>
</body>
</html>
