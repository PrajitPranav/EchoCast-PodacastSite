<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoCast - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: url('/Templates/Login.jpg') no-repeat center center fixed; 
      background-size: cover; 
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .wrapper {
      position: relative;
      width: 760px;
      height: 500px;
    }

    .card {
      position: absolute;
      top: 0;
      width: 360px;
      height: 100%;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      backdrop-filter: blur(15px);
      transition: transform 0.7s ease, opacity 0.7s ease;
    }

    /* LOGIN CARD */
    .login-card {
      background: rgba(20, 10, 30, 0.7);
      border: 1px solid rgba(192, 101, 187, 0.3);
      backdrop-filter: blur(20px);
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      left: 0;
      color: #fff;
    }

    .login-card h2 {
      font-size: 1.8rem;
      font-weight: 700;
      font-family: 'Raleway', sans-serif;
    }

    .login-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .login-header button {
      background: linear-gradient(135deg, #c065bb, #792b73);
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.3s;
    }
    
    .login-header button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(192, 101, 187, 0.4);
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 40px 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      outline: none;
      background: rgba(0, 0, 0, 0.4);
      font-size: 0.95rem;
      color: #fff;
      transition: 0.3s;
    }
    
    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    
    .input-group input:focus {
      border-color: #c065bb;
      background: rgba(0, 0, 0, 0.6);
    }

    .input-group i {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.1rem;
    }

    .forgot-btn {
      align-self: flex-end;
      font-size: 0.85rem;
      color: #c065bb;
      cursor: pointer;
      text-decoration: none;
      margin-top: -5px;
      margin-bottom: 10px;
      font-weight: 500;
      transition: 0.2s;
    }
    
    .forgot-btn:hover {
      text-decoration: underline;
    }

    .disclaimer {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.4;
    }

    .info-link {
      font-size: 0.85rem;
      color: #c065bb;
      text-decoration: none;
      cursor: pointer;
      font-weight: 500;
    }

    .submit-btn {
      background: linear-gradient(135deg, #c065bb, #792b73);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      font-size: 1.4rem;
      cursor: pointer;
      align-self: flex-end;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    
    .submit-btn:hover {
      transform: scale(1.1) rotate(-10deg);
      box-shadow: 0 8px 20px rgba(192, 101, 187, 0.5);
    }

    /* CALENDAR CARD */
    .calendar-card {
      background: rgba(20, 10, 30, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      padding: 40px 25px;
      right: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
    }

    .calendar-card::before {
      display: none;
    }

    .calendar-content {
      position: relative;
      z-index: 1;
      font-family: 'Raleway', sans-serif;
      text-align: center;
      color: #fff;
    }

    .calendar-content h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .calendar-content small {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    .calendar-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 60px;
      position: relative;
      z-index: 1;
    }

    .calendar-footer span {
      font-weight: 600;
      font-family: 'Raleway', sans-serif;
      color: rgba(255, 255, 255, 0.8);
    }

    .calendar-footer button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 20px;
      padding: 8px 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .calendar-footer button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* REFERENCES */
    .references {
      position: absolute;
      bottom: 30px;
      left: 30px;
      background: rgba(20, 10, 30, 0.8);
      border: 1px solid rgba(192, 101, 187, 0.4);
      color: #fff;
      border-radius: 20px;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      max-width: 350px;
      width: 100%;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .references span {
      font-weight: 700;
      font-size: 1.1rem;
      line-height: 1.2;
    }

    .references button {
      background: linear-gradient(135deg, #c065bb, #792b73);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: 0.3s;
    }
    
    .references button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(192, 101, 187, 0.4);
    }

    /* Swapping states */
    .login-left { transform: translateX(0); }
    .login-right { transform: translateX(400px); }

    .calendar-right { transform: translateX(0); }
    .calendar-left { transform: translateX(-400px); }

    /* Responsive */
    @media (max-width: 820px) {
      .wrapper {
        width: 100%;
        height: auto;
      }
      .card {
        position: relative;
        width: 100%;
        transform: translateX(0) !important;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card login-card login-left" id="loginCard">
      <div class="login-header">
        <h2 id="loginTitle">Log in</h2>
        <button id="swapBtn">Sign Up</button>
      </div>

      <div id="formFields">
        <div class="input-group">
          <input type="email" id="email" placeholder="e-mail address" name="email">
          <i>📧</i>
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder="password" name="password">
          <i>🔒</i>
        </div>
        <div class="forgot-btn">I forgot</div>
      </div>

      <p class="disclaimer">By continuing, you agree to our Terms of Service and Privacy Policy.</p>
      <span class="info-link">Click here for more info.</span>

      <button class="submit-btn">→</button>

    </div>

    <div class="card calendar-card calendar-right" id="calendarCard">
      <div class="calendar-content">
        <h1 id="dateDisplay"></h1>
        <small id="timeDisplay"></small>
      </div>
      <div class="calendar-footer">
        <span>Creative.style</span>
        <button>Click Here</button>
      </div>
    </div>
  </div>

  <!-- References -->
  <div class="references">
    <span>EchoCast<br>Podcast</span>
    <button>Discover</button>
  </div>

 <script>
  const swapBtn = document.getElementById("swapBtn");
  const loginCard = document.getElementById("loginCard");
  const calendarCard = document.getElementById("calendarCard");
  const loginTitle = document.getElementById("loginTitle");
  const formFields = document.getElementById("formFields");
  const submitBtn = document.querySelector(".submit-btn");

  let swapped = false;

  swapBtn.addEventListener("click", () => {
    if (!swapped) {
      loginCard.classList.remove("login-left");
      loginCard.classList.add("login-right");

      calendarCard.classList.remove("calendar-right");
      calendarCard.classList.add("calendar-left");

      loginTitle.textContent = "Sign Up";
      swapBtn.textContent = "Log In";
      formFields.innerHTML = `
        <div class="input-group">
          <input type="text" id="username" placeholder="username" name="username">
          <i>👤</i>
        </div>
        <div class="input-group">
          <input type="email" id="email" placeholder="e-mail address" name="email">
          <i>📧</i>
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder="password" name="password">
          <i>🔒</i>
        </div>
        <div class="input-group">
          <input type="password" id="confirmPassword" placeholder="confirm password" name="confirmPassword">
          <i>🔒</i>
        </div>
      `;
      swapped = true;
    } else {
      loginCard.classList.remove("login-right");
      loginCard.classList.add("login-left");

      calendarCard.classList.remove("calendar-left");
      calendarCard.classList.add("calendar-right");

      loginTitle.textContent = "Log in";
      swapBtn.textContent = "Sign Up";
      formFields.innerHTML = `
        <div class="input-group">
          <input type="email" id="email" placeholder="e-mail address" name="email">
          <i>📧</i>
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder="password" name="password">
          <i>🔒</i>
        </div>
        <div class="forgot-btn">I forgot</div>
      `;
      swapped = false;
    }
  });

  submitBtn.addEventListener("click", async () => {
    const mode = swapped ? "signup" : "login";

    let data = {};
    if (mode === "signup") {
      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }

      data = { username, email, password };
    } else {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      data = { email, password };
    }

    try {
      const res = await fetch(`http://localhost:3000/${mode}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const result = await res.json();
      if (res.ok && result.token) {
        localStorage.setItem("token", result.token);
        if (result.username) localStorage.setItem("username", result.username);
        if (result.role) localStorage.setItem("role", result.role);
        alert(result.message);
        if (result.redirect) {
          window.location.href = result.redirect;
        } else {
          window.location.href = "home.html";
        }
      } else {
        alert(result.message || "Failed to authenticate");
      }
    } catch (err) {
      console.error(err);
      alert("Something went wrong. Check server!");
    }
  });

  function updateDateTime() {
    const dateEl = document.getElementById("dateDisplay");
    const timeEl = document.getElementById("timeDisplay");

    const now = new Date();
    const options = { weekday: "long", year: "numeric", month: "long", day: "numeric" };

    dateEl.textContent = now.toLocaleDateString("en-US", options);
    timeEl.textContent = now.toLocaleTimeString("en-US", { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  setInterval(updateDateTime, 1000);
  updateDateTime();
</script>

</body>
</html>
